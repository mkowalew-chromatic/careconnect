name: Chromatic

# Design-system visual review. The main run auto-accepts, so the baseline every
# PR is compared against is whatever is on main, not the last manually accepted
# build.
#
# Deliberately unfiltered by path. A `paths:` filter would stop the workflow
# from triggering at all on PRs that miss it, and a check that never starts
# stays pending forever — so requiring Chromatic's "UI Tests" / "UI Review"
# status in branch protection would deadlock every non-design-system PR. (A job
# skipped by an `if:` is different: it reports a conclusion, which branch
# protection accepts.) TurboSnap makes the unfiltered runs cheap — a PR that
# touches no story snapshots nothing and bills nothing; the cost is one
# Storybook build per run.
on:
  pull_request:
  push:
    branches: [main]
  # Required checks must also report on merge-queue refs, or the queue stalls
  # waiting for a status that never arrives. Harmless when no queue is enabled.
  merge_group:

# Cancel superseded PR runs — a new push to a PR makes the previous Chromatic
# build irrelevant. Main runs are never cancelled: each one auto-accepts and
# becomes the baseline for later PRs, so losing one would leave the next PR
# comparing against a stale build.
concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  visual-review:
    name: Visual regression review
    runs-on: ubuntu-latest
    # Chromatic can't run without a project token; skip rather than fail red on
    # forks and on repos where the secret hasn't been set up yet.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      pull-requests: write
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Chromatic uses git history to pick a baseline

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Skip rather than fail red until CHROMATIC_PROJECT_TOKEN is configured
      # (see packages/design-system/CONTRIBUTING.md). secrets.* can't be read in
      # a job-level `if`, so the token is promoted to env above and tested here.
      #
      # The official action rather than `npx chromatic`: on pull_request events
      # actions/checkout checks out GitHub's synthetic merge commit, and the bare
      # CLI then reports the build against that commit instead of the PR head —
      # so the "UI Tests" / "UI Review" statuses never land on the PR and
      # Chromatic's PR review stays pending forever. The action forwards the
      # pull_request head SHA and branch from the event payload.
      - name: Publish to Chromatic
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        uses: chromaui/action@v18
        with:
          projectToken: ${{ env.CHROMATIC_PROJECT_TOKEN }}
          workingDir: packages/design-system
          exitZeroOnChanges: true
          autoAcceptChanges: ${{ github.event_name == 'push' }}
          # TurboSnap: snapshot only the stories the commit actually affects,
          # traced through Vite's module graph. Needs the full git history
          # fetched above; the CLI adds `--stats-json` to build-storybook
          # itself. Chromatic falls back to a full build when it can't trace a
          # change (dependency bumps, or the first build on a branch).
          onlyChanged: true
