name: Chromatic

# Design-system visual review. Runs on PRs that touch the design system and on
# main after they merge — the main run auto-accepts, so the baseline every PR
# is compared against is whatever is on main, not the last manually accepted
# build.
on:
  pull_request:
    paths:
      - 'packages/design-system/**'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - 'packages/design-system/**'
      - 'package-lock.json'

jobs:
  visual-review:
    name: Visual regression review
    runs-on: ubuntu-latest
    # Chromatic can't run without a project token; skip rather than fail red on
    # forks and on repos where the secret hasn't been set up yet.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      pull-requests: write
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Chromatic uses git history to pick a baseline

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Skip rather than fail red until CHROMATIC_PROJECT_TOKEN is configured
      # (see packages/design-system/CONTRIBUTING.md). secrets.* can't be read in
      # a job-level `if`, so the token is promoted to env above and tested here.
      #
      # The official action rather than `npx chromatic`: on pull_request events
      # actions/checkout checks out GitHub's synthetic merge commit, and the bare
      # CLI then reports the build against that commit instead of the PR head —
      # so the "UI Tests" / "UI Review" statuses never land on the PR and
      # Chromatic's PR review stays pending forever. The action forwards the
      # pull_request head SHA and branch from the event payload.
      - name: Publish to Chromatic
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        uses: chromaui/action@v18
        with:
          projectToken: ${{ env.CHROMATIC_PROJECT_TOKEN }}
          workingDir: packages/design-system
          exitZeroOnChanges: true
          autoAcceptChanges: ${{ github.event_name == 'push' }}
