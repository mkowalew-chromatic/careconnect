name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Every workspace is private and linked locally, so no registry auth is
      # needed — the design system is built from source rather than installed.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Excludes the smoke tests, which need a running stack (see smoke:test).
      - name: Unit tests
        run: npm test

      - name: Build all workspaces
        run: npm run build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit
          path: packages/design-system/test-results/junit.xml
          if-no-files-found: ignore
